<title>OSS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first single column with a bottom tab bar; on desktop the tabs become a left rail and content sits in a 720px column. */
:root{
  --bg:#f2f5f4; --panel:#ffffff; --ink:#172220; --mute:#5f6f6b; --line:#d9e1de;
  --accent:#0f7a68; --accent-ink:#ffffff; --accent-soft:#dcefea;
  --warn:#b7791f; --warn-soft:#fbf1dc; --bad:#b4433a; --bad-soft:#f9e3e0; --good:#2f7d4f; --good-soft:#dff1e4;
  --display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#182020; --ink:#e8efec; --mute:#9aaaa5; --line:#2a3634;
  --accent:#3fbba3; --accent-ink:#06211c; --accent-soft:#163b35;
  --warn:#e0a94a; --warn-soft:#3a2d12; --bad:#e2756b; --bad-soft:#3f1f1c; --good:#6cc48c; --good-soft:#193726; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#182020; --ink:#e8efec; --mute:#9aaaa5; --line:#2a3634;
  --accent:#3fbba3; --accent-ink:#06211c; --accent-soft:#163b35;
  --warn:#e0a94a; --warn-soft:#3a2d12; --bad:#e2756b; --bad-soft:#3f1f1c; --good:#6cc48c; --good-soft:#193726; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
@media (max-width:900px){input,select,textarea{font-size:16px!important}html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-family:var(--display);font-size:26px;font-weight:700}
h2{font-family:var(--display);font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.app{min-height:100%;display:flex;flex-direction:column}
.main{flex:1;width:100%;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 140px;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{background:none;border:0;padding:6px 1px;border-radius:10px;font-size:10px;white-space:nowrap;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:40px;flex:1}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (min-width:900px){
  .app{flex-direction:row}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);left:auto;right:auto;bottom:auto;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 10px;width:112px;flex:none}
  .nav button{width:100%;font-size:12px;padding:10px 6px}
  .main{padding-block:28px 60px}
}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.neutral{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.small{font-size:13px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);line-height:1.6}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
.q{font-family:var(--display);font-size:19px;font-weight:500;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.plan{display:flex;flex-direction:column;gap:8px}
.plan .item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.plan .item .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.plan .item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan .item.done .t{text-decoration:line-through;color:var(--mute)}
.plan .min{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:auto;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.topic{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.topic:hover{border-color:var(--accent)}
.topic .en{font-family:var(--display);font-weight:700}
.topic .ko{font-size:12.5px;color:var(--mute)}
.timer{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.timer.over{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.fb{display:flex;flex-direction:column;gap:14px}
.fb .lvl{display:flex;align-items:baseline;gap:10px}
.fb .lvl b{font-family:var(--display);font-size:40px;line-height:1}
.fix{border-left:3px solid var(--bad);padding:6px 12px;display:flex;flex-direction:column;gap:3px;background:var(--bg);border-radius:0 10px 10px 0}
.fix .o{text-decoration:line-through;color:var(--mute)}
.fix .b{font-weight:500}
.fix .w{font-size:13px;color:var(--mute)}
.model{background:var(--bg);border-radius:10px;padding:12px;line-height:1.7;white-space:pre-wrap}
.kx{display:flex;flex-direction:column;gap:4px}
.kx div{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.kx .en{font-weight:500}
.kx .ko{font-size:13px;color:var(--mute)}
.flash{perspective:1000px;min-height:200px;cursor:pointer}
.flash .in{position:relative;width:100%;min-height:200px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.flash .back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash .big{font-family:var(--display);font-size:22px;font-weight:700}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.li .d{font-family:var(--mono);font-size:12px;color:var(--mute);flex:none}
.note{font-size:13px;color:var(--mute);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.note.ai{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
.segs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.segs .seg{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.segs .seg.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.cks label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;background:var(--panel)}
.cks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cks input{margin:0;accent-color:var(--accent)}
.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
svg.chart{width:100%;height:auto;display:block}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.spk{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--accent)}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sent{padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.6}
.sent.cur{background:var(--accent-soft)}
.sent:hover{background:var(--bg)}
.hidden-q{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mute)}
.mini{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:8px 14px;display:flex;align-items:center;gap:10px;z-index:6;font-size:13px}
.mini .now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:8px;padding:0;width:38px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.mini button svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
@media (min-width:900px){.mini{left:112px;bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
.nowbox{background:var(--accent-soft);border-radius:12px;padding:16px;min-height:96px;display:flex;flex-direction:column;gap:6px}
.nowbox .en{font-family:var(--display);font-size:19px;font-weight:500;line-height:1.35}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bb{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.55;position:relative}
.bb.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bb.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bb .ko{display:block;font-size:12.5px;color:var(--mute);margin-top:4px}
.bb.me .ko{color:var(--accent-ink);opacity:.8}
.fixc{align-self:flex-end;max-width:88%;background:var(--warn-soft);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.fixc .o{text-decoration:line-through;color:var(--mute)}
.fixc .b{font-weight:500}
.fixc .w{color:var(--warn)}
.bubbles.hidetext .bb.ai{color:transparent;user-select:none}
.bubbles.hidetext .bb.ai .row,.bubbles.hidetext .bb.ai .spk{color:var(--accent)}
.bubbles.hidetext .bb.ai .btn{color:var(--ink)}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chatin{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px}
@media (min-width:900px){.chatin{bottom:0}}
.login{max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.login .brand{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.login input[type=password],.login input[type=email]{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdrR{display:flex;align-items:center;gap:6px;flex-shrink:0}
@media (max-width:900px){.hdrR{flex-direction:column;align-items:flex-end;gap:4px}}
details summary{cursor:pointer;font-weight:500}
.mocknav{display:flex;gap:4px;flex-wrap:wrap}
.mocknav i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.mocknav i.done{background:var(--accent)}.mocknav i.cur{background:var(--warn)}
</style>

<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div class="mini" id="mini" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* show a startup/runtime error on screen instead of a blank page */
window.addEventListener("error",e=>{try{const m=document.getElementById("main");const box=document.getElementById("errbox")||Object.assign(document.createElement("div"),{id:"errbox"});box.style.cssText="margin:12px 16px;padding:10px 12px;border-radius:10px;background:#f9e3e0;color:#b4433a;font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-all";box.textContent="⚠ 오류: "+(e.message||e.error)+"\n"+((e.error&&e.error.stack)||"").split("\n").slice(0,3).join("\n");(m||document.body).prepend(box)}catch(x){}});
window.addEventListener("unhandledrejection",e=>{try{const r=e.reason;if(r&&(r.code||/network|fetch/i.test(r.message||"")))return;const ev=new ErrorEvent("error",{message:"(async) "+((r&&r.message)||r),error:r});window.dispatchEvent(ev)}catch(x){}});
/* ============ DATA ============ */
const LEVELS=["NL","NM","NH","IL","IM1","IM2","IM3","IH","AL"];
const TARGETS=["IM3","IH","AL"];
const tgt=()=>TARGETS.includes(S?.profile?.target)?S.profile.target:"IM3";
const tgtIdx=()=>LEVELS.indexOf(tgt());
const TARGET_SPEC={IM3:{words:"110-150",desc:"paragraph-length answers with a clear structure (opener restating the question → 2-3 details or a short past-tense story → one-line closer), fluent connectors and fillers, mostly accurate past tense, concrete personal details. Vocabulary: everyday, not fancy.",chat:"simple enough for an intermediate learner; ask friendly, concrete questions about everyday life",strategy:"IM3 전략: 겹치는 스크립트를 재활용할 수 있는 주제로 5–6개를 고르세요. (예: 공원·조깅·걷기는 같은 장소 이야기로 묶기)"},
 IH:{words:"150-190",desc:"well-organized answers that handle complications and unexpected follow-ups, compare past and present, give reasons and examples, control past/present/future tenses, and use varied (but natural) vocabulary and idiomatic connectors (that said, to be fair, what really struck me…).",chat:"natural pace for an upper-intermediate learner; sometimes add a complication, a follow-up 'why', or ask for a comparison or an opinion",strategy:"IH 전략: 주제를 7–8개로 넓히고, 각 주제에서 '예전 vs 요즘' 비교와 돌발 상황(문제 해결) 이야기를 준비하세요."},
 AL:{words:"180-230",desc:"fluent, cohesive narration across all time frames, supported opinions with reasons and counterpoints, precise and idiomatic vocabulary, hypothetical/conditional language, and natural discourse markers — the way an articulate native speaker would answer in conversation.",chat:"speak like a native friend at normal speed; challenge the learner with abstract questions, hypotheticals, and requests to justify opinions",strategy:"AL 전략: 모든 주제에서 의견 + 이유 + 반론 구조를 준비하고, 가정법·관용 표현을 스크립트에 녹이세요."}};
const spec=()=>TARGET_SPEC[tgt()];

const TOPICS=[
 {id:"intro",en:"Self-introduction",ko:"자기소개",group:"기본",qs:[
  {t:"intro",q:"Let's start the interview now. Tell me a little bit about yourself.",k:"인터뷰를 시작하겠습니다. 자기소개를 간단히 해 주세요."}]},
 {id:"home",en:"Home",ko:"거주지 (아파트/주택)",group:"서베이",qs:[
  {t:"desc",q:"I would like to know where you live. Can you describe your home to me? What does it look like?",k:"어디에 사는지 알고 싶어요. 집을 묘사해 주세요. 어떻게 생겼나요?"},
  {t:"routine",q:"What do you usually do at home on weekends? Tell me about a typical weekend at home.",k:"주말에 집에서 보통 무엇을 하나요? 전형적인 집에서의 주말을 말해 주세요."},
  {t:"exp",q:"Tell me about a problem you had at home recently. What was it, and how did you solve it?",k:"최근 집에서 겪은 문제를 말해 주세요. 어떤 문제였고 어떻게 해결했나요?"},
  {t:"compare",q:"How is your current home different from the one you lived in before?",k:"지금 사는 집은 예전에 살던 집과 어떻게 다른가요?"}]},
 {id:"movies",en:"Movies",ko:"영화 보기",group:"서베이",qs:[
  {t:"desc",q:"You indicated that you like watching movies. What kind of movies do you like, and why?",k:"영화 보는 것을 좋아한다고 했죠. 어떤 영화를 좋아하고, 왜 좋아하나요?"},
  {t:"routine",q:"When and where do you usually watch movies? Who do you go with? Tell me about your typical movie routine.",k:"보통 언제, 어디서 영화를 보나요? 누구와 가나요? 영화 보는 전형적인 루틴을 말해 주세요."},
  {t:"exp",q:"Tell me about the most memorable movie you have ever seen. What was it about, and why was it memorable?",k:"지금까지 본 가장 기억에 남는 영화를 말해 주세요. 어떤 내용이었고 왜 기억에 남나요?"},
  {t:"compare",q:"How have movies or movie theaters changed since you were young?",k:"어릴 때와 비교해 영화나 영화관이 어떻게 바뀌었나요?"}]},
 {id:"park",en:"Parks",ko:"공원 가기",group:"서베이",qs:[
  {t:"desc",q:"You said you like going to parks. Describe your favorite park. What does it look like?",k:"공원에 가는 것을 좋아한다고 했죠. 가장 좋아하는 공원을 묘사해 주세요. 어떻게 생겼나요?"},
  {t:"routine",q:"What do you usually do when you go to the park? Who do you go with?",k:"공원에 가면 보통 무엇을 하나요? 누구와 가나요?"},
  {t:"exp",q:"Tell me about a memorable experience you had at a park.",k:"공원에서 있었던 기억에 남는 경험을 말해 주세요."}]},
 {id:"concert",en:"Concerts",ko:"콘서트 보기",group:"서베이",qs:[
  {t:"desc",q:"You indicated that you go to concerts. What kind of concerts do you like to go to?",k:"콘서트에 간다고 했죠. 어떤 콘서트에 가는 것을 좋아하나요?"},

const lvNorm=l=>{const t=String(l||"").toUpperCase().replace(/INTERMEDIATE\s*MID\s*/g,"IM").replace(/INTERMEDIATE\s*HIGH/g,"IH").replace(/INTERMEDIATE\s*LOW/g,"IL").replace(/ADVANCED\s*LOW/g,"AL").replace(/NOVICE\s*(LOW|MID|HIGH)/g,(m,a)=>"N"+a[0]).replace(/IM\s*([123])/g,"IM$1");const m=t.match(/(?:^|[^A-Z])(IM[123]|NL|NM|NH|IL|IH|AL)(?![A-Z])/);return m?m[1]:""};

const RUBRIC=()=>`You are an OPIc (ACTFL) rater. The learner is Korean; target level is ${tgt()}. OPIc levels in order: NL, NM, NH, IL, IM1, IM2, IM3, IH, AL.
Rating guide: IL = short sentences, lists; IM1-2 = full sentences, basic connectors, some past tense errors; IM3 = paragraph-length answers with a clear structure (intro-body-ending), fluent connectors, mostly accurate past tense, personal details; IH = handles complications and unexpected questions, varied vocabulary, past/present/future controlled; AL = narrates in all time frames consistently, supports opinions, native-like idioms.
Judge primarily on: structure, amount of detail, tense control, connectors/fillers, vocabulary range, and task completion. Ignore spelling and punctuation (the answer was dictated by voice). Explanations for the learner are in Korean (존댓말, 간결하게); example sentences are in English.`;

async function evaluate(question,answer,secs,onText,pron){
  const T=tgt();const up=LEVELS[Math.min(8,tgtIdx()+1)];
  const prompt=`${RUBRIC()}

Question: "${question}"
Speaking time: about ${secs} seconds (ideal 60-120 seconds).
Learner's answer (voice-dictated) — this single answer is the ONLY thing you rate:
"""
${answer}
"""
${pron?`Pronunciation assessment of the recording (Azure, 0-100): overall ${pron.pron}, accuracy ${pron.acc}, fluency ${pron.flu}${(pron.prosody??pron.pros)!=null?", prosody/intonation "+(pron.prosody??pron.pros):""}${pron.low&&pron.low.length?`; mispronounced words: ${pron.low.map(x=>x.w+" ("+x.s+")").join(", ")}`:""}. The transcript above is verbatim speech recognition (fillers and grammar mistakes kept). Mention pronunciation briefly in the summary (Korean) and, if useful, add one fix about it.
`:""}${nameHint()}Background profile (NOT part of the answer; use it only to fill in small missing details of the model answers, never to replace the learner's story): ${profileText()}

Rules: evaluate this answer alone. Every comment, strength and fix must refer to what is actually in the answer above — places, people and events exactly as the learner said them. Do not mention places, trips or details that appear only in the profile. The model answers must tell the SAME story as the learner (same place, same event), just better.

Reply with ONLY one JSON object:
{"level":"IM2","score":62,"summary":"한국어 총평 2-3문장","strengths":["한국어로 잘한 점 2-3개"],"fixes":[{"original":"learner's phrase","better":"improved phrase","why":"한국어 설명 한 줄"}],"model_target":"A model answer at ${T} level (${spec().words} words): ${spec().desc} First person, natural spoken English, keeping the learner's own story and details from the answer",${T==="AL"?"":`"model_up":"The same answer upgraded to ${up} level (${TARGET_SPEC[up].words} words)",`}"expressions":[{"en":"useful expression from the model answers","ko":"한국어 뜻"}]}
Give 3-5 fixes and 4-6 expressions. "score" is 0-100 within the overall scale (IM3 starts around 65, IH around 78, AL around 90).`;
  const r=await sample.json(prompt,{...(typeof onText==="function"?{onText}:{}),cache:false});if(r){r.model_target=r.model_target||r.model_im3;r.model_up=r.model_up||r.model_ih;r.target=T;r.up=T==="AL"?null:up}return r;
}

function audEl(){if(!AUD.el){AUD.el=new Audio();AUD.el.preload="auto";

    AUD.el.addEventListener("pause",()=>{const a=AUD.el,src=a.src;setTimeout(()=>{if(!player.on||player.paused||player.sys||!a.paused||a.ended||a.src!==src||!src||Date.now()-(AUD.own||0)<600)return;sysPaused()},300)});
    AUD.el.addEventListener("timeupdate",()=>{const a=AUD.el;if(player.on&&a.src&&!/silence_/.test(a.src)&&a.currentTime>0){player.lastT=a.currentTime;player.lastSi=player.si;player.lastI=player.i}});
    AUD.el.addEventListener("playing",()=>{if(player.sys){player.sys=false;clearInterval(player.sysT);mediaSession()}})}
  return AUD.el}
function sysPaused(){player.sys=true;audLog.push("시스템이 재생을 멈춤 (알림 등)");mediaSession();
  // the interruption is usually short: try to continue for a while (works as long as the page is still awake)
  let n=0;clearInterval(player.sysT);player.sysT=setInterval(()=>{if(!player.sys||!player.on||player.paused||++n>8){clearInterval(player.sysT);return}sysResume(true)},1500)}
function playingNow(){const a=AUD.el;return !!(a&&a.src&&!a.paused&&!a.ended)||(tts.ok&&speechSynthesis.speaking&&!speechSynthesis.paused)}
function remotePlay(){if(!player.on)return;if(player.paused){playerPause();return}
  if(playingNow()&&!player.sys){mediaSession();return}
  player.sys=false;clearInterval(player.sysT);keepAlive(true);const a=AUD.el;audLog.push("잠금화면 ▶");
  const restart=()=>{clearTimeout(player.t);player.t=null;player.busy=false;player.tok=(player.tok||0)+1;
    if(!player.segs.length&&player.lastI===player.i&&player.items[player.i]){player.segs=buildSegs(player.items[player.i])}

function needTrans(text){return splitSent(text).filter(x=>!S.trans[x])}
const TRANS_VER=2;
function transSources(){const out=[];const add=(t,q)=>{if(typeof t==="string"&&t.trim())out.push({q:q||"",sents:splitSent(t)})};
  for(const [store,isS] of [[S.scripts,0],[S.samples||{},1]])for(const [tid,sc] of Object.entries(store)){const t=TOPICS.find(x=>x.id===tid);(sc&&sc.scripts||[]).forEach((x,i)=>add(x&&x.answer,t&&t.qs[i]?t.qs[i].q:""))}
  for(const [q,m] of Object.entries(S.models||{}))add(m,q);return out}
async function translateSents(sents,onProgress,force){if(!sample)throw{code:"not_granted"};if(!Object.keys(S.trans||{}).length)S.transVer=TRANS_VER;const want=new Set(sents.filter(x=>force||!S.trans[x]));if(!want.size)return;
  // translate whole answers (with their question) so each sentence is rendered in context, not in isolation
  const groups=[];const seen=new Set();for(const g of transSources()){if(!g.sents.some(x=>want.has(x)))continue;const key=g.sents.join(" ");if(seen.has(key))continue;seen.add(key);groups.push(g)}
  const orphan=[...want].filter(x=>!groups.some(g=>g.sents.includes(x)));if(orphan.length)groups.push({q:"",sents:orphan});
  let done=0;const total=groups.reduce((a,g)=>a+g.sents.length,0);const retry=[];
  for(let i=0;i<groups.length;){const batch=[];let n=0;while(i<groups.length&&(n===0||n+groups[i].sents.length<=36)){batch.push(groups[i]);n+=groups[i].sents.length;i++}
    const body=batch.map((g,k)=>`### Answer ${k+1}${g.q?"\nQuestion: "+g.q:""}\n`+g.sents.map((x,m)=>`${m+1}. ${x}`).join("\n")).join("\n\n");
    const r=await sample.json(`You are a professional English→Korean translator making study subtitles for a Korean OPIc learner.
Translate every numbered sentence of each spoken answer below into natural Korean that a Korean speaker would actually say in the same situation.
Rules:
- Read the whole answer first and translate each sentence in context (keep pronouns, tense and flow consistent across sentences).
- Spoken, friendly 해요체 (e.g. "저는 주말마다 공원에 가요."), the way someone would answer an interviewer. Never stiff written style (~이다/~하였다), never literal word-by-word translation.
- Render idioms, fillers and discourse markers by meaning (e.g. "You know," → "있잖아요,", "To be honest," → "솔직히 말하면,", "It was a blast" → "정말 재밌었어요").
- Keep proper nouns and numbers; drop "I" (저는) when Korean would naturally omit it. Keep each translation about as short as the original.
- Exactly one Korean string per numbered sentence, same order, nothing merged or split.
Reply with ONLY a JSON object: {"answers":[["번역1","번역2",...], ...]} — one array per answer, in order.

${body}`,{cache:false});
    const arr=r&&Array.isArray(r.answers)?r.answers:Array.isArray(r)?r:[];
    batch.forEach((g,k)=>{const tr=arr[k];if(!Array.isArray(tr)||tr.length!==g.sents.length){audLog.push("번역 줄 수 불일치 → 다시 시도");if(batch.length>1||!g._retry)retry.push(g);return}g.sents.forEach((en,m)=>{if((force?want.has(en):!S.trans[en]||want.has(en))&&typeof tr[m]==="string"&&tr[m].trim())S.trans[en]=tr[m].trim()})});
    done+=n;onProgress&&onProgress(Math.min(done,total),total);save();
    // an answer whose line count came back wrong is asked again on its own, once
    if(i>=groups.length&&retry.length){for(const g of retry.splice(0))if(!g._retry){g._retry=true;groups.push(g)}}}}
// sentences of scripts / examples / model answers that have no Korean translation yet (Claude mode, quietly, capped per run)
async function fillTrans(){if(!sample||fillTrans.on)return;const miss=[...new Set(transSources().flatMap(g=>g.sents).filter(x=>!S.trans[x]))].slice(0,150);if(!miss.length)return;
  fillTrans.on=true;const before=Object.keys(S.trans).length;try{await translateSents(miss,null)}catch(e){}finally{fillTrans.on=false}const n=Object.keys(S.trans).length-before;if(n>0){save();toast("해석 "+n+"문장을 새로 만들었어요");if(view==="scripts"||view==="listen")render()}}
// my expression cards without a translation: Claude mode → AI translation; web → machine translation (upgraded by AI later)
async function fillCardKo(){if(fillCardKo.on)return;const ai=!!sample;const miss=(S.custom||[]).filter(c=>c&&/[a-z]/i.test(c.en||"")&&(!String(c.ko||"").trim()||(ai&&c.koSrc==="mt")));if(!miss.length)return;
  if(!ai&&!(WEB&&navigator.onLine))return;fillCardKo.on=true;let n=0;
  try{if(ai){for(let i=0;i<miss.length;i+=30){const b=miss.slice(i,i+30);let r=null;
      try{r=await sample.json(`Translate each English expression below into natural Korean for a Korean OPIc learner's flashcards. Use 해요체 for full sentences and a short natural meaning for phrases. Keep "___" as ___.\n\n${b.map((c,k)=>(k+1)+". "+c.en).join("\n")}\n\nReply with ONLY JSON: {"ko":["...", ...]} — exactly ${b.length} strings, same order.`)}catch(e){break}
      const arr=r&&Array.isArray(r.ko)?r.ko:null;if(!arr||arr.length!==b.length)continue;b.forEach((c,k)=>{const t=String(arr[k]||"").trim();if(t){c.ko=t;delete c.koSrc;n++}})}}
    else{for(const c of miss.slice(0,60)){try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q="+encodeURIComponent(c.en.replace(/___/g,"something")));if(!r.ok)break;const j=await r.json();const t=(j&&j[0]||[]).map(x=>x&&x[0]||"").join("").trim();if(t){c.ko=t;c.koSrc="mt";n++}}catch(e){break}}}}
  finally{fillCardKo.on=false}
  if(n){save();if(view==="cards")render();if(player.on)for(const it of player.items){if(it.kind==="C"&&!it.ko){const c=S.custom.find(x=>x.en.replace(/___/g,"something")===it.en);if(c&&c.ko)it.ko=c.ko}}toast("내 표현 "+n+"개 해석을 채웠어요")}}
function transOf(sent){if(S.trans[sent])return S.trans[sent];for(const c of (S.custom||[]))if(c&&c.ko&&String(c.en||"").replace(/___/g,"something").trim()===sent)return c.ko;return ""}

loadLocal();cloudInit();render();setTimeout(prepSyncCode,500);setTimeout(()=>{if(!cloud.ok||cloud.skip)applyPendingSync()},800);loadManifests().then(()=>{if(view==="listen"||view==="settings")render()});loadTextManifests();
(async()=>{
  if(!window.claude?.use)return;
  const [u,d,s]=await Promise.all([claude.use("user"),claude.use("db"),claude.use("sample")]);
  if(!u){gated=true;render();return}
  // results from the platform are frozen: hand the app plain mutable copies
  sample=s?wrapSample(s):s;
  if(u&&d){try{uid=await u.id();db=d;const col=db.collection("data/users/"+uid);
    try{window.__oss_notOwner=!(await u.isOwner());const cw=await u.can?.("data.write");if(cw===false){claudeCanWrite=false}}catch(e){}
    const remote=await claudeLoad(col);const m={exists:!!remote};
    if(remote){/* db data is frozen: claudeLoad returns a plain copy */
      if((remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(structuredClone(DEF),remote);try{localStorage.setItem("opic30",JSON.stringify(S))}catch(e){}}else if((S.updatedAt||0)>(remote.updatedAt||0)){mergeState(remote,true)}
      claudeSavedAt=remote.updatedAt||0}
    docRef=col;if(!m.exists&&S.updatedAt)claudePush()}catch(e){docRef=null;toast("Claude 계정 저장소 연결 실패: "+(e.code||e.message||e))}}
  render();setTimeout(applyPendingSync,300);setTimeout(()=>fillCardKo().then(()=>fillTrans()),5000);
})();
